<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e11">
<title>LanGui 专业工作库</title>
<meta name="description" content="个人工作台账">
<style>
/* 视觉：沿用新站深色剪辑台风格（build/app.html 的配色与质感）；结构与类名按旧站 site-edit */
:root{color-scheme:dark;
--sky:#40b8e0;--teal:#169a88;--green:#6dbb3f;--sun:#f2cf1d;--orange:#f08020;--navy:#30439c;
--ok:#1f9d4c;--ok2:#3ccf74;--rec:#ff3b30;
--bg:#0c0e11;--bg2:#101317;--paper:#15181d;--panel2:#1b1f25;--ink:#e9ebee;--muted:#9aa3ad;--dim:#6c7580;--line:#252a31;--line2:#323843;
--gold:#e9b949;--accent:#f0a23b;--accent-ink:#1a1206;--acc-soft:rgba(240,162,59,.13);--chip:#20252c;
--trk-script:#9b7cf2;--trk-footage:#3f8ef5;--trk-shoot:#ff7a6e;--trk-edit:#25b6a2;--trk-deliver:#6dbb3f;
--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Roboto Mono","PingFang SC","Microsoft YaHei",monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 500px at 70% -10%,rgba(240,162,59,.06),transparent 60%),var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
::selection{background:var(--accent);color:var(--accent-ink)}
.rainbow{height:3px;background:linear-gradient(90deg,var(--sky),var(--teal),var(--green),var(--sun),var(--orange),var(--navy))}
.ledger{width:100%;max-width:none;margin:0 auto;padding:6px clamp(12px,2vw,36px) 40px}
.ledger :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(255,59,48,.18);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}
/* 顶部：年份切换 + 刷新页面 */
.archive-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.archive-top>div{display:flex;gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.archive-top a{display:inline-flex;align-items:center;justify-content:center;width:84px;height:34px;border-radius:5px;font-family:var(--mono);font-weight:700;color:var(--muted)}
.archive-top a:hover{color:var(--ink)}
.archive-top a[aria-current]{background:var(--accent);color:var(--accent-ink)}
.refresh-button{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:linear-gradient(#22262d,#1b1f25);cursor:pointer;font-size:14px}
.refresh-button:hover{border-color:#4a515d}.refresh-button svg{transition:transform .18s}.refresh-button:hover svg{transform:rotate(-25deg)}
/* 品牌头部（场记板 + 取景框） */
.ledger-header{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,38%);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#08090b;min-height:170px}
.ledger-header-main{display:flex;flex-direction:column;background:linear-gradient(180deg,#111419,#0b0d10)}
.slate-bar{height:18px;background:repeating-linear-gradient(-55deg,#f2f2f2 0 18px,#111 18px 36px);border-bottom:2px solid #000}
.ledger-header-body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,2.6vw,32px)}
.ledger-brand{display:flex;align-items:center;gap:16px;min-width:0}
.production-viewfinder{position:relative;display:grid;place-items:center;flex:0 0 auto;width:58px;height:58px;font-family:var(--mono);font-weight:800;letter-spacing:2px;color:var(--gold);border-radius:6px;background:#0e1013}
.production-viewfinder:before{content:"";position:absolute;inset:0;--c:var(--gold);background:linear-gradient(var(--c),var(--c)) 0 0/12px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 12px,linear-gradient(var(--c),var(--c)) 100% 0/12px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 12px,linear-gradient(var(--c),var(--c)) 0 100%/12px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 12px,linear-gradient(var(--c),var(--c)) 100% 100%/12px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 12px;background-repeat:no-repeat}
.ledger-brand p{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.ledger-brand h1{font-size:clamp(24px,3.4vw,40px);line-height:1.15;font-weight:800;color:#fff;margin-top:6px}
.ledger-brand time{display:block;margin-top:6px;font-family:var(--mono);font-size:13px;color:var(--gold)}
.ledger-total{display:grid;justify-items:end;gap:2px;padding:10px 16px;border:1px solid #2b3038;border-radius:6px;background:#0e1013;white-space:nowrap}
.ledger-total strong{font-family:var(--mono);font-size:28px;line-height:1.1;color:#fff}
.ledger-total span{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.ledger-viewer{position:relative;background:#050607 center 30%/cover no-repeat;border-left:1px solid var(--line)}
.ledger-viewer:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,11,.85),transparent 35%),linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.5))}
.ledger-viewer .hud{position:absolute;left:16px;right:16px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.85);text-shadow:0 1px 2px #000}
.ledger-viewer .hud.top{top:14px}.ledger-viewer .hud.bot{bottom:14px}.ledger-viewer .hud span{display:flex;align-items:center;gap:6px}
/* 五个板块按钮 */
.workspace-switch{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px;padding:8px;border-radius:10px;background:rgba(21,24,29,.92);border:1px solid var(--line)}
.workspace-switch button{width:150px;height:38px;border-radius:6px;border:1px solid var(--line2);background:linear-gradient(#22262d,#1b1f25);cursor:pointer;font-size:14px;font-weight:700;color:var(--ink)}
.workspace-switch button:hover{border-color:#4a515d}
.workspace-switch button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
/* 本周工作：周头 */
.planner-week{margin-bottom:28px}
.planner-hero{display:grid;grid-template-columns:minmax(180px,1fr) minmax(340px,2fr);align-items:center;gap:12px 22px;padding:16px 18px;background:linear-gradient(180deg,#14171c,#0f1115);border:1px solid var(--line);border-radius:10px}
.planner-kicker{display:none;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:700}
.planner-hero h2{font-size:26px;font-weight:800;line-height:1.25;margin-top:2px}
.planner-range{font-family:var(--mono);font-size:12px;color:var(--muted)}
.planner-week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#0b0d10}
.planner-week-strip>div{position:relative;display:grid;justify-items:center;padding:12px 0 8px;border-right:1px solid #1f242b;font-size:11px;color:var(--dim);background:repeating-linear-gradient(90deg,#2a3038 0 1px,transparent 1px 10%) top/100% 6px no-repeat}
.planner-week-strip>div:last-child{border-right:0}
.planner-week-strip span{font-family:var(--mono)}
.planner-week-strip strong{font-family:var(--mono);font-size:18px;color:#d9dde2;line-height:1.3}
.planner-week-strip small{display:none}
.planner-week-strip>div[aria-current]{background-color:rgba(255,59,48,.08)}
.planner-week-strip>div[aria-current]:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--rec);opacity:.85}
.planner-week-strip>div[aria-current]:after{content:"";position:absolute;top:0;left:50%;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--rec)}
.planner-week-strip>div[aria-current] strong,.planner-week-strip>div[aria-current] span{position:relative;z-index:1;background:#140d0d;padding:0 4px;border-radius:3px;color:#fff}
.planner-week-strip i{position:absolute;bottom:3px;left:50%;margin-left:-9px;width:18px;height:3px;border-radius:2px;background:var(--gold)}
.week-picker{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.week-month{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-right:6px}
.week-month select{height:32px;border-radius:5px;border:1px solid var(--line2);background:var(--bg2);padding:0 8px;font-size:13px}
.week-picker a{display:inline-flex;align-items:center;justify-content:center;width:76px;height:32px;border-radius:5px;border:1px solid var(--line2);background:linear-gradient(#22262d,#1b1f25);font-size:13px}
.week-picker a:hover{border-color:#4a515d}
.week-picker a[aria-current=page]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.planner-week>[role=alert]:empty{display:none}
[role=alert]{color:#ff9d95;font-size:13px}
/* 四个区：本周工作内容 / 本周排期 / 今天 / 昨天做了什么 */
.planner-week-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
@media(min-width:720px){.planner-week-overview{grid-template-columns:minmax(0,.85fr) minmax(0,1.2fr) minmax(0,.95fr)}}
@media(min-width:1200px){.planner-week-overview{grid-template-columns:minmax(0,.85fr) minmax(0,1.2fr) minmax(0,.95fr) minmax(0,.95fr)}}
.planner-group{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
@media(min-width:720px){.planner-week-overview>.planner-group{height:440px;display:flex;flex-direction:column}}
.planner-group h3{display:flex;align-items:center;justify-content:flex-start;gap:8px;font-size:15px;font-weight:700;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.planner-group h3:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex:0 0 auto;margin-right:-2px}
.planner-group h3 small{margin-left:auto;font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);background:var(--chip);border-radius:4px;padding:1px 7px;white-space:nowrap}
.planner-today h3:before{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.6s ease-in-out infinite}
.week-status-groups{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.week-status-group{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--bg2);overflow:hidden}
.week-status-group.is-open{flex:1.4}.week-status-group.is-done{flex:1}
.week-status-group h4{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;font-weight:700;background:#1a1e24;border-bottom:1px solid var(--line)}
.week-status-group h4 span{color:var(--rec);font-size:10px}.week-status-group.is-done h4 span{color:var(--ok2);font-size:13px}
.week-status-group h4 small{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--muted)}
.planner-week-list{flex:1;min-height:0;overflow:auto;padding:0 10px}
.planner-week-list li{display:grid;grid-template-columns:minmax(0,1fr) auto 15px;gap:7px;padding:8px 1px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45}
.planner-week-list li:last-child{border-bottom:0}
.planner-week-list strong{font-weight:600;overflow-wrap:anywhere}
.planner-week-list small{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.week-done-check{color:var(--ok2);font-weight:900}
.week-status-empty{padding:10px;color:var(--dim);font-size:13px}
.planner-grid{display:grid;grid-auto-rows:max-content;gap:10px;flex:1;min-height:0;overflow:auto;align-content:start;padding-right:2px}
.planner-card{position:relative;background:linear-gradient(180deg,#1a1e24,#15181d);border:1px solid var(--line2);border-radius:7px;padding:0 12px 12px;overflow:hidden}
.planner-card:before{content:"";display:block;height:4px;margin:0 -12px 10px;background:var(--sky)}
.planner-card:has(.planner-urgent):before{background:var(--orange)}.planner-card:has(.planner-done):before{background:var(--ok)}
.planner-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.planner-card-top>div{display:flex;gap:5px;flex-wrap:wrap}
.planner-date{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700;background:var(--acc-soft);border-radius:4px;padding:1px 8px}
.planner-date small{font-size:11px;color:var(--muted);font-weight:400}
.planner-date-empty{color:var(--dim);background:var(--chip)}
.planner-carry-label,.planner-urgent,.planner-done,.work-tag{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:4px;background:var(--chip);color:var(--muted);white-space:nowrap}
.planner-urgent{background:rgba(240,128,32,.14);color:#ffb070}
.planner-done{background:rgba(31,157,76,.16);color:#8fe0ad}
.planner-carry-label{background:rgba(91,140,255,.13);color:#a9c1ff}
.work-tag[style]{background:hsl(var(--tag-h) 40% 18%);color:hsl(var(--tag-h) 70% 78%)}
.planner-card h4{font-size:16px;font-weight:700;margin:7px 0 8px;line-height:1.4;overflow-wrap:anywhere}
.planner-card>a{font-size:12px;color:var(--gold)}
.planner-card>p{font-size:12px;color:var(--muted)}
.planner-progress,.planner-next{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.55;margin-top:6px}
.planner-progress span,.planner-next span{font-size:11px;color:var(--dim);padding-top:2px}
.planner-progress p{color:#d5dadf;overflow-wrap:anywhere}
.planner-next{padding:8px;border-radius:5px;background:rgba(37,182,162,.07);border-left:2px solid var(--trk-edit)}
.planner-next p{color:#c3c9d0;overflow-wrap:anywhere}
.planner-original{margin-top:5px;font-family:var(--mono);font-size:12px;color:#a9c1ff}
.planner-card .work-link{margin-top:8px}
/* 视频制作进度：轨道色块 */
.video-stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:4px 0 8px}
.video-stage{--t:#555;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 6px;border-radius:4px;border:1px solid var(--line2);background:#111418;font-size:11px;min-width:0;position:relative;overflow:hidden}
.video-stage:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--t);opacity:.35}
.video-stage:nth-child(1){--t:var(--trk-script)}.video-stage:nth-child(2){--t:var(--trk-footage)}.video-stage:nth-child(3){--t:var(--trk-shoot)}.video-stage:nth-child(4){--t:var(--trk-edit)}.video-stage:nth-child(5){--t:var(--trk-deliver)}
.video-stage-label{font-weight:700;color:#d5dadf;padding-left:3px}
.video-stage-state{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-stage-done{border-color:color-mix(in srgb,var(--t) 60%,transparent);background:color-mix(in srgb,var(--t) 16%,#111418)}.video-stage-done:before{opacity:1}.video-stage-done .video-stage-state{color:#cfe9d8}
.video-stage-active{border-color:var(--t);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--t) 22%,#111418) 0 6px,#111418 6px 12px)}.video-stage-active:before{opacity:1}.video-stage-active .video-stage-state{color:#fff;font-weight:600}
.video-stage-waiting{border:1px dashed var(--orange)}.video-stage-waiting .video-stage-state{color:#ffb070}
.video-stage-skipped{opacity:.55}
/* 今天 / 昨天 */
.daily-list,.yesterday-list{flex:1;min-height:0;overflow:auto}
.daily-list li,.yesterday-list li{position:relative;padding:8px 0 8px 18px;border-bottom:1px dashed var(--line);font-size:14px}
.daily-list li:before,.yesterday-list li:before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;border:2px solid var(--accent)}
.daily-list p,.yesterday-list p{margin-top:3px;color:var(--muted);font-size:13px}
.daily-kind{display:inline-block;margin-left:7px;font-size:11px;line-height:18px;padding:0 7px;border-radius:4px;background:rgba(37,182,162,.14);color:#6fdcc9}
.planner-empty{padding:10px 12px;border:1px dashed var(--line2);border-radius:6px;color:var(--dim);font-size:13px}
/* 本周做了什么 / 整体汇报 */
.weekly-recap{margin-bottom:28px;padding:0;overflow:hidden}
.recap-toggle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#14171c,#0f1115)}
.recap-toggle span{font-size:20px;font-weight:800}
.recap-toggle small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.weekly-actual-list{padding:4px 18px}
.weekly-actual-row{display:grid;grid-template-columns:70px minmax(140px,.35fr) minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.weekly-actual-row:last-child{border-bottom:0}
.weekly-actual-row time{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:1px}
.weekly-actual-row p{color:#c3c9d0;font-size:14px}
.weekly-actual-empty{padding:16px 0;color:var(--dim)}
.recap-footer{padding:12px 18px;border-top:1px solid var(--line)}
.weekly-recap>[role=alert]{padding:0 18px 10px}
.weekly-speech{margin:16px 18px;background:#f6f2e8;color:#1f2226;border-radius:6px;box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.4)}
.weekly-speech-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:2px solid #1f2226}
.speech-heading span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#8a8475}
.weekly-speech .speech-heading h3{display:block;font-size:18px;font-weight:800;color:#111;padding:0;margin:0;border:0}.weekly-speech .speech-heading h3:before{display:none}
.weekly-speech .work-link{background:#1f2226;color:#f6f2e8;border-color:#1f2226}
.weekly-speech-text{padding:16px 22px 20px;line-height:1.95;font-size:15px}
.weekly-speech-text p+p{margin-top:10px}
.speech-project{background:none;color:#b8860b;font-weight:700}
/* 按钮 */
.work-link,.work-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:linear-gradient(#22262d,#1b1f25);cursor:pointer;font-size:13px;white-space:nowrap}
.work-link:hover,.work-button:hover{border-color:#4a515d}
.work-button{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.edit-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border:1px dashed var(--accent);border-radius:8px;background:var(--acc-soft)}
.edit-bar span{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;margin-right:4px}
/* 月度工作记录 */
.work-month-title{font-size:22px;font-weight:800;margin:30px 0 12px;display:flex;align-items:center;gap:12px;scroll-margin-top:12px}
.work-month-title:before{content:"ARCHIVE";font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);border:1px solid var(--line2);border-radius:4px;padding:2px 7px;font-weight:400}
.work-month-title:after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 10px,transparent 10px 17px);border-radius:2px}
.ledger-summary{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:10px;margin-bottom:14px}
.ledger-summary>div{display:grid;gap:4px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.ledger-summary small{font-size:12px;color:var(--muted)}
.ledger-summary strong{font-size:24px;font-family:var(--mono);line-height:1.2}
.ledger-summary .ledger-period{border-left:3px solid var(--accent)}
.ledger-summary .ledger-period strong{font-family:inherit}
.ledger-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.month-archive{position:sticky;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.month-archive-head{display:grid;padding:12px 14px;background:linear-gradient(180deg,#1a1e24,#14171c);border-bottom:1px solid var(--line)}
.month-archive-head span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent)}
.month-archive-head strong{font-family:var(--mono);font-size:26px;line-height:1.2}
.month-archive-head small{font-size:11px;color:var(--muted)}
.month-archive-groups{padding:8px}
.month-quarter+.month-quarter{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.month-quarter-label{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;color:var(--muted)}
.month-quarter-label b{font-family:var(--mono);font-size:10px;padding:0 5px;border-radius:3px;background:var(--chip);color:var(--ink)}
.month-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.month-tiles a{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;height:58px;border:1px solid var(--line2);border-radius:5px;background:linear-gradient(#1b1f25,#15181d);overflow:hidden}
.month-tiles a:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line2)}
.month-quarter:nth-child(1) .month-tiles a:before{background:var(--sky)}.month-quarter:nth-child(2) .month-tiles a:before{background:var(--green)}.month-quarter:nth-child(3) .month-tiles a:before{background:var(--sun)}.month-quarter:nth-child(4) .month-tiles a:before{background:var(--orange)}
.month-tiles a strong{font-size:15px}.month-tiles a strong small{font-size:10px;margin-left:1px}
.month-tiles a>span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.month-tiles a:hover{border-color:#4a515d}
.month-tiles a[aria-current]{background:var(--acc-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.month-tiles a[aria-current]>span{color:var(--ink)}
.month-unknown{display:flex;justify-content:space-between;margin-top:8px;padding:8px;border:1px dashed var(--line2);border-radius:5px;font-size:12px}
.ledger-panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-width:0;overflow:hidden}
.ledger-title{padding:14px 18px;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);background:linear-gradient(180deg,#181b21,#14171c)}
.ledger-title h2{font-size:20px;font-weight:800}
.ledger-title p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.ledger-filter{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(3,minmax(0,1fr)) auto;align-items:end;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.ledger-select{display:grid;gap:4px;min-width:0}
.ledger-select>span{font-size:11px;color:var(--muted);font-weight:700}
.ledger-filter input,.ledger-filter select{width:100%;height:40px;border:1px solid var(--line2);border-radius:6px;background:var(--bg2);padding:0 12px;min-width:0}
.ledger-filter input:focus,.ledger-filter select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.ledger-filter button{height:40px;width:88px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.ledger-scroll{overflow:auto;max-height:70vh}
.ledger table{width:100%;border-collapse:collapse;min-width:640px;text-align:left;font-size:14px}
.ledger th,.ledger td{padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
.ledger th{position:sticky;top:0;z-index:1;background:#1c2026;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;border-bottom:1px solid var(--line2)}
.ledger td:first-child{white-space:nowrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.ledger td:nth-child(2){font-weight:700;color:#fff;min-width:200px;width:26%}
.ledger td:nth-child(3){color:#c9cfd5}
.ledger tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
.ledger tbody tr:hover{background:var(--acc-soft)}
.ledger tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.ledger-completion{width:96px;text-align:center!important}
.ledger-tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(31,157,76,.2);border:1px solid rgba(60,207,116,.6);color:var(--ok2);font-weight:900;font-size:12px}
.ledger-event{display:block;margin-top:3px;font-family:var(--mono);font-size:12px;font-weight:400;color:#a9c1ff}
td:nth-child(3) .ledger-event{color:var(--dim);font-family:inherit}
td>a[data-nav]{font-size:12px;color:var(--gold);font-weight:400}
.ledger td .work-link{height:26px;font-size:12px;margin-top:6px;font-weight:400}
.ledger-empty{padding:20px 18px;color:var(--muted)}
/* 社交媒体月份任务 */
.social-board{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px}
.social-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:20px 22px;background:linear-gradient(180deg,#14171c,#0f1115);border-bottom:1px solid var(--line)}
.social-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--accent);font-weight:700;margin-bottom:4px}
.social-heading h2{font-size:clamp(21px,2.2vw,28px);font-weight:800}
.social-heading h2+p{font-size:13px;color:var(--muted);margin-top:4px}
.social-month{display:grid;gap:5px;font-size:11px;color:var(--muted)}
.social-month select{min-width:140px;height:36px;border:1px solid var(--line2);border-radius:6px;background:var(--bg2);padding:0 10px;font-weight:700}
.social-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.social-summary>div{display:flex;align-items:baseline;gap:9px;padding:12px 22px;background:#12151a}
.social-summary strong{font-family:var(--mono);font-size:22px;color:var(--gold)}
.social-summary span{font-size:12px;color:var(--muted)}
.social-note{padding:10px 22px;color:var(--dim);font-size:12px}
.social-list-head,.social-list>li{display:grid;grid-template-columns:130px minmax(160px,1fr) minmax(0,2fr);gap:20px;align-items:start}
.social-list-head{padding:8px 22px;background:#1c2026;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.social-list>li{padding:14px 22px;border-bottom:1px solid var(--line)}
.social-list>li:nth-child(even){background:rgba(255,255,255,.018)}
.social-date{display:flex;align-items:center;gap:9px}
.social-date>span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.social-date strong{font-family:var(--mono);font-size:14px;color:var(--accent);white-space:nowrap}
.social-topic h3{font-size:15px;font-weight:700;color:var(--gold)}
.social-linked{display:inline-block;margin-top:5px;font-size:11px;color:#6fdcc9}
.social-status{display:inline-block;margin:5px 0 0 8px;padding:0 7px;border-radius:4px;background:rgba(31,157,76,.16);color:#8fe0ad;font-size:11px}
.social-detail{display:grid;gap:5px;min-width:0}
.social-detail p{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:13px;color:#c9cfd5;overflow-wrap:anywhere}
.social-detail p span{font-size:11px;color:var(--dim);font-weight:700;padding-top:2px}
.social-detail p.social-progress{color:#6fdcc9}
.social-extra{padding:0 22px;border-bottom:1px solid var(--line)}
.social-extra summary{padding:12px 0;font-size:13px;font-weight:700;color:var(--accent);cursor:pointer}
.social-extra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding-bottom:16px}
.social-extra-grid strong{font-size:12px;color:var(--gold)}.social-extra-grid p{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.6}
.social-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;color:var(--dim);font-size:11px}
.social-bottom div{display:flex;gap:10px;flex-wrap:wrap}.social-bottom strong{color:var(--muted)}
/* 成片交付安排 */
.delivery-overview{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px}
.delivery-heading{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:18px 22px;background:linear-gradient(180deg,#14171c,#0f1115);border-bottom:1px solid var(--line)}
.delivery-heading h2{font-size:22px;font-weight:800}.delivery-heading p{font-size:13px;color:var(--muted)}
.delivery-overview>p{padding:18px 22px;color:var(--muted)}
.delivery-scroll{overflow:auto}
.delivery-overview table{width:100%;border-collapse:collapse;min-width:720px;font-size:14px;text-align:left}
.delivery-overview th,.delivery-overview td{padding:12px 16px;vertical-align:top;border-bottom:1px solid var(--line)}
.delivery-overview th{background:#1c2026;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.delivery-overview td:first-child{width:30%}.delivery-overview td:first-child strong{color:var(--gold);font-size:15px}
.delivery-overview td:nth-child(2),.delivery-overview td:nth-child(3){white-space:nowrap;font-family:var(--mono);font-size:13px}
.delivery-overview td:nth-child(3) strong{color:#fff}
.delivery-overview td:nth-child(4){color:#c9cfd5}
.delivery-origin{display:block;font-size:11px;color:#a9c1ff;margin-top:2px}
.delivery-overview details{margin-top:6px;font-size:12px;color:var(--muted)}
.delivery-overview summary{cursor:pointer;color:#a9b1ba}
.delivery-overview details p{margin-top:5px;line-height:1.6}
/* 页脚 */
.langui-footer{margin:24px clamp(12px,2vw,36px) 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 24px;background:#07080a;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.langui-footer:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,transparent 0 8px,#2a2d33 8px 20px,transparent 20px 24px)}
.langui-footer span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
.langui-footer strong{display:block;font-size:20px;font-weight:800;margin-top:2px}
.langui-footer-track{display:grid;grid-template-columns:2fr 3fr 1.5fr 2.5fr 1fr;gap:3px;width:min(360px,100%);padding:8px;background:#0e1013;border:1px solid #1f232a;border-radius:6px}
.langui-footer-track i{height:22px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.langui-footer-track i:nth-child(1){background:var(--sky)}.langui-footer-track i:nth-child(2){background:var(--teal)}.langui-footer-track i:nth-child(3){background:var(--green)}.langui-footer-track i:nth-child(4){background:var(--sun)}.langui-footer-track i:nth-child(5){background:var(--orange)}
/* 维护模式弹窗（旧站 WorkEditor） */
.work-dialog{margin:auto;width:min(600px,calc(100% - 24px));max-height:90dvh;padding:18px;border:1px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.work-dialog::backdrop{background:rgba(3,4,6,.72)}
.work-dialog .work-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.work-dialog h2{font-size:18px}
.work-dialog .work-heading button{border:1px solid var(--line2);background:var(--bg2);border-radius:5px;width:30px;height:30px;cursor:pointer}
.work-dialog label{display:grid;gap:4px;margin:8px 0;font-size:13px;color:var(--muted)}
.work-dialog input,.work-dialog select,.work-dialog textarea{border:1px solid var(--line2);border-radius:6px;background:var(--bg2);padding:7px 10px;color:var(--ink)}
.work-dialog textarea{min-height:80px}
.work-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.work-inline{display:flex!important;align-items:center;gap:8px}
.work-dialog details{font-size:13px;color:var(--muted);margin:6px 0}
.work-dialog p{font-size:13px;color:var(--muted);margin:6px 0}
/* 响应式 */
@media(max-width:860px){.ledger-filter{grid-template-columns:repeat(3,minmax(0,1fr))}.ledger-filter input[type=search],.ledger-filter button{grid-column:1/-1;width:100%}}
@media(max-width:720px){
 .ledger-header{grid-template-columns:1fr}.ledger-viewer{order:-1;min-height:170px;border-left:0;border-bottom:1px solid var(--line)}
 .ledger-header-body{padding:14px}.production-viewfinder{width:42px;height:42px;font-size:13px}.ledger-total{padding:8px 10px}.ledger-total strong{font-size:22px}
 .planner-hero{grid-template-columns:minmax(0,1fr);padding:12px}.planner-hero h2{font-size:22px}
 .week-month{flex:1 1 100%}.week-month select{flex:1}.week-picker a{width:calc(20% - 5px)}
 .ledger-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ledger-layout{grid-template-columns:minmax(0,1fr)}.month-archive{position:static}
 .planner-week-list{max-height:200px}.planner-grid{max-height:520px}
 .weekly-actual-row{grid-template-columns:1fr;gap:3px}
 .social-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.social-list-head{display:none}.social-list>li{grid-template-columns:1fr;gap:7px;padding:14px 16px}.social-heading{padding:16px;align-items:flex-start}.social-extra-grid{grid-template-columns:1fr}
 .ledger table{min-width:0}.ledger td:nth-child(2){min-width:0;width:34%}.ledger-completion{width:48px}.ledger th{letter-spacing:0}
 .archive-top a{width:64px}.refresh-button{white-space:nowrap;padding:0 10px}.ledger th,.ledger td{padding:8px;font-size:13px}.ledger td:first-child{white-space:normal}
 .work-fields{grid-template-columns:1fr}
}
@media(max-width:680px){.workspace-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.workspace-switch button{width:auto;min-width:0;font-size:13px}}
</style>
</head>

    completed: completed || null, nextStep: value('nextStep', 1000) || null, review: review || null };
  var nextEventId = function(){ return db.events.concat(saved.addedEvents).reduce(function(m, e){ return Math.max(m, e.id); }, 0) + 1; };
  var addEvent = function(e){ e.id = nextEventId(); db.events.push(e); saved.addedEvents.push(e); };

    var prior = db.events.filter(function(e){ return e.taskId === old.id; }).sort(function(a, b){ return b.id - a.id; })[0];
    var row = Object.assign({ id: old.id }, changes);

  persist(); return created;
}

  o += '<div class="social-summary" aria-label="任务统计"><div><strong>' + shown.length + '</strong><span>内容主题</span></div><div><strong>' + scheduled + '</strong><span>已安排发布日期</span></div><div><strong>' + (shown.length - scheduled) + '</strong><span>发布日期待定</span></div>' + (month === '2026-11' ? '<div><strong>5</strong><span>社交媒体平台</span></div>' : '') + '</div>';
  o += '<p class="social-note">日期为计划发布日期；内容主题数量不等于视频数量。</p><div class="social-list-head"><span>发布日期</span><span>内容主题</span><span>制作内容与工作任务</span></div><ol class="social-list">' +
    shown.map(function(it, i){ return '<li><div class="social-date"><span>' + String(i + 1).padStart(2,'0') + '</span><strong>' + (it.publishDate ? md(it.publishDate) : '日期待定') + '</strong></div>' +
      '<div class="social-topic"><h3>' + esc(it.title) + '</h3>' + (it.linkedTaskId ? '<span class="social-linked">关联工作：' + esc(it.linkedTitle || '工作库任务') + '</span>' : '') + ((it.linkedDone || it.status) ? '<span class="social-status">' + (it.linkedDone ? '已完成' : esc(it.status)) + '</span>' : '') + '</div>' +
      '<div class="social-detail"><p><span>制作内容</span>' + esc(it.content) + '</p><p><span>工作任务</span>' + esc(it.task) + '</p>' + (it.linkedProgress ? '<p class="social-progress"><span>最新进展</span>' + esc(it.linkedProgress) + '</p>' : '') + (it.note ? '<p class="social-progress"><span>备注</span>' + esc(it.note) + '</p>' : '') + '</div></li>'; }).join('') + '</ol>';
  if (month === '2026-11') o += '<details class="social-extra"><summary>工作类型与重点</summary><div class="social-extra-grid"><div><strong>视频制作</strong><p>项目故事、康复服务、教育支持、职业培训、感恩节视频、全球捐赠日宣传、活动记录</p></div><div><strong>平面设计</strong><p>年报数据轮播图、项目宣传图片、FAQ轮播图、节日活动宣传图</p></div><div><strong>内容策划</strong><p>18项内容主题策划、视频脚本、社交媒体文案、素材整理</p></div><div><strong>重点工作</strong><p>' + tgDate + '感恩节特别视频、12月1日全球捐赠日宣传、各项目日常内容制作、团队活动视频制作</p></div></div></details>';
  o += '<div class="social-bottom">' + (month === '2026-11' ? '<div><strong>发布平台</strong><span>Facebook · Instagram · TikTok · YouTube · LinkedIn</span></div>' : '') + '<p>具体视频、图片及轮播图数量根据实际制作要求确定。</p></div></section>';
  return o;
}

  if (!d.length) return o + '<p>暂无成片交付安排</p></section>';
  o += '<div class="delivery-scroll"><table><thead><tr><th>视频项目</th><th>初版目标（备注）</th><th>成片交付</th><th>当前进度</th></tr></thead><tbody>' + d.map(function(row){
    var fc = (row.nextStep || '').match(/(\d{1,2}月\d{1,2}日)出初版/);
    return '<tr><td><strong>' + esc(row.title) + '</strong>' + (d.filter(function(x){ return x.title === row.title; }).length > 1 ? '<small class="delivery-origin">' + Number(row.month.slice(0,4)) + '年' + Number(row.month.slice(5)) + '月档案</small>' : '') +
      '<details><summary>制作安排</summary><p>' + esc(row.nextStep || '') + '</p></details></td><td>' + (fc ? fc[1] : '备注未记录') + '</td><td><strong>' + (row.deadline ? '<time datetime="' + row.deadline + '">' + Number(row.deadline.slice(5,7)) + '月' + Number(row.deadline.slice(8)) + '日</time>' : '日期待定') + '</strong></td><td>' + esc(row.progress) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
  return o;
}

/* WorkEditor（旧站组件；旧站页面未挂载，只在 ?edit=1 维护模式出现） */
var STAGE_OPTIONS = ['脚本已确认','收集素材中','剪辑中','字幕核对中','已导出待验收','已交付','已发布'];
var CATEGORY_OPTIONS = ['公益视频','字幕与翻译','活动与汇报','行政与采购','报销','视频制作','行政','采购','汇报','团队规划'];
function openEditor(id, week){
  var row = id ? M.rows.filter(function(r){ return r.id === id; })[0] : null;
  var latest = row && row.history[row.history.length - 1];
  var v = function(x){ return esc(x == null ? '' : x); };
  var dlg = $('workDialog');
  dlg.innerHTML = '<form id="workForm"><div class="work-heading"><h2>' + (row ? '工作详情' : '新增工作') + '</h2><button type="button" data-act="close-dialog" aria-label="关闭">✕</button></div>' +
    '<label>工作事项<input name="title" required maxlength="250" value="' + v(row && row.title) + '"></label><div class="work-fields">' +
    '<label>记录日期<input name="date" value="' + v(row ? row.date : TODAY) + '" placeholder="可留空"></label>' +
    '<label>所属项目<input name="project" list="work-projects" value="' + v(row && row.project) + '"><datalist id="work-projects">' + M.projects.map(function(p){ return '<option value="' + v(p) + '">'; }).join('') + '</datalist></label>' +
    '<label>类别<input name="category" list="work-categories" value="' + v(row && row.category) + '"></label>' +
    '<label>简短进度<input name="progress" list="work-stages" value="' + v(row && row.progress) + '"></label>' +
    '<label>计划日期<input type="date" name="planned" value="' + v(row && row.planned) + '"></label>' +
    '<label>实际完成日期<input type="date" name="completed" value="' + v(row && row.completed) + '"></label>' +
    '<label>反馈与验收<select name="review">' + ['', '待素材', '待反馈', '待验收'].map(function(o){ return '<option value="' + o + '"' + (((row && row.review) || '') === o ? ' selected' : '') + '>' + (o || '无') + '</option>'; }).join('') + '</select></label>' +
    '<label class="work-inline"><input type="checkbox" name="done"' + (row && row.done ? ' checked' : '') + '> 标记完成</label></div>' +
    (week ? '<label class="work-inline"><input type="checkbox" name="week"' + (!row || row.week === week ? ' checked' : '') + '> 加入所选周待安排</label>' : '') +
    (row && row.originalPlan ? '<p>原计划日期：' + row.originalPlan + '</p>' : '') +
    '<label>正在等什么<input name="waiting" value="' + v(latest && latest.waiting) + '"></label>' +
    '<label>下次跟进日期<input type="date" name="followUp" value="' + v(latest && latest.followUp) + '"></label>' +
    (row && row.history.length ? '<details><summary>进度历史</summary><ul>' + row.history.map(function(e){ return '<li>' + e.day + ' · ' + esc(e.progress || (e.done ? '已完成' : '—')) + '</li>'; }).join('') + '</ul></details>' : '') +
    '<label>下一步<textarea name="nextStep" maxlength="1000">' + v(row && row.nextStep) + '</textarea></label>' +
    '<p role="alert" id="workError"></p><button class="work-button">保存</button></form>';
  dlg.dataset.id = row ? row.id : ''; dlg.dataset.week = week || '';
  dlg.showModal();
}
function submitEditor(form){
  var dlg = $('workDialog'), id = dlg.dataset.id ? Number(dlg.dataset.id) : null, week = dlg.dataset.week || null;
  var row = id ? M.rows.filter(function(r){ return r.id === id; })[0] : null;
  var fields = {}; new FormData(form).forEach(function(val, k){ fields[k] = val; });
  try {
    apiWork(Object.assign({}, fields, { id: id == null ? undefined : id, done: fields.done === 'on', week: week ? (fields.week === 'on' ? week : (row && row.week === week ? null : (row ? row.week : null))) : (row ? row.week : null) }));
    dlg.close(); render();
  } catch (e) { $('workError').textContent = e.message || '保存失败'; }
}

/* 导出 / 导入备份（离线版代替服务器数据库所必需） */
function exportBackup(){
  var db = currentDb();
  var blob = new Blob([JSON.stringify({ app: 'LanGui 专业工作库', format: 'langui-backup-v3', exportedAt: new Date().toISOString(), base: BASE.version, saved: saved, database: db }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'LanGui工作库备份_' + TODAY + '.json'; document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file){
  var r = new FileReader();
  r.onload = function(){ try { var j = JSON.parse(r.result); if (!j || j.format !== 'langui-backup-v3' || !j.saved || j.saved.v !== 3) throw Error('不是本工作库的备份文件');
    saved = j.saved; persist(); render(); alert('已导入备份'); } catch (e) { alert('导入失败：' + e.message); } };
  r.readAsText(file);
}

/* ── 事件 ── */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[data-nav]');
  if (a){
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    var nav = a.dataset.nav;
    if (nav === 'year') push(yearTargetHref(a.dataset.month));
    else if (nav === 'month') push(ledgerChangeUrl(a.dataset.month, {}));
    else { var href = a.getAttribute('href'); push(href); var hash = location.hash.slice(1); if (hash){ var el = document.getElementById(hash); if (el) el.scrollIntoView({ block: 'start' }); } }
    return;
  }
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.view){
    var view = b.dataset.view, url = new URL(location.href);
    if (view === 'week' && url.searchParams.has('month')) url.searchParams.set('view', 'home');
    url.hash = view === 'social' ? 'social-media' : view === 'delivery' ? 'delivery' : view === 'weekly-record' ? 'weekly-record' : view === 'weekly-report' ? 'weekly-report' : '';
    push(url); return;
  }
  if (b.id === 'refreshButton'){ location.reload(); return; }
  var act = b.dataset.act;
  if (act === 'copy-record' || act === 'copy-speech'){
    ui.error = ''; var text = act === 'copy-record' ? ui.copyText : ui.speech;
    copy(text).then(function(){ if (act === 'copy-record') ui.copied = true; else ui.speechCopied = true; render(); setTimeout(function(){ ui.copied = false; ui.speechCopied = false; render(); }, 2500); },
      function(){ ui.error = '复制失败，可选择文字手动复制'; render(); });
    return;
  }
  if (act === 'close-dialog'){ $('workDialog').close(); return; }
  if (act === 'export'){ exportBackup(); return; }
  if (act === 'import'){ $('importFile').click(); return; }
  if (b.dataset.edit){ openEditor(Number(b.dataset.edit), b.dataset.week || null); return; }
  if (b.dataset.new){ openEditor(null, b.dataset.week || null); return; }
});
function copy(text){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
  return fallback();
  function fallback(){ return new Promise(function(res, rej){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {} t.remove(); ok ? res() : rej(); }); }
}
document.addEventListener('change', function(e){
  if (e.target.id === 'weekMonthSelect'){
    var month = e.target.value, first = month + '-01', fw = shift(first, (8 - new Date(first + 'T00:00:00Z').getUTCDay()) % 7);
    var url = new URL(location.href); url.searchParams.set('week', fw); if (url.searchParams.has('month')) url.searchParams.set('view', 'home'); url.hash = '';
    push(url);
  } else if (e.target.id === 'socialMonthSelect'){
    ui.socialMonth = e.target.value; var u = new URL(location.href); u.searchParams.set('socialMonth', e.target.value); try { history.replaceState(null, '', u); } catch (x) {} render();
  } else if (e.target.id === 'importFile' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('submit', function(e){
  if (e.target.id === 'ledgerFilter'){
    e.preventDefault();
    var f = {}; new FormData(e.target).forEach(function(v, k){ if (v) f[k] = v; });
    push(ledgerChangeUrl(ledgerSelection().month, f));
  } else if (e.target.id === 'workForm'){ e.preventDefault(); submitEditor(e.target); }
});
window.addEventListener('popstate', render);
window.addEventListener('hashchange', render);
/* 旧站 LiveSync：别的窗口改了数据，这里自动更新（编辑中不打扰） */
window.addEventListener('storage', function(e){
  if (e.key !== KEY) return;
  saved = loadSaved();
  var f = document.activeElement;
  if ((f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) || document.querySelector('dialog[open]')) return;
  render();
});
/* 首次打开：回到页面顶部，去掉 #week（与旧站相同） */
(function(){
  if (location.hash === '#week'){ var u = new URL(location.href); u.hash = ''; try { history.replaceState(history.state, '', u); } catch (x) {} }
  render();
  if (!location.hash) window.scrollTo(0, 0);
})();
window.__LG = { apiWork: apiWork, currentDb: currentDb, model: function(){ return model(); } };
})();
